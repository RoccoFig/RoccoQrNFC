<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de carteles</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      max-width: 780px;
      margin: 40px auto;
      padding: 0 16px;
      color: #222;
      line-height: 1.4;
    }
    h1 { font-size: 1.4rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; font-size: 0.9rem; }
    th { color: #555; }
    input[type=text], input[type=password], input[type=number] {
      padding: 8px; width: 100%; box-sizing: border-box;
      border: 1px solid #ccc; border-radius: 4px;
    }
    label { display: block; margin-top: 12px; font-size: 0.9rem; color: #444; }
    button {
      padding: 8px 16px; margin-top: 14px; cursor: pointer;
      border: none; border-radius: 4px; background: #222; color: #fff;
    }
    button:hover { background: #444; }
    .flash { background: #eef4ff; padding: 10px; margin-bottom: 14px; border-radius: 4px; font-size: 0.9rem; }
    .sin-destino { color: #a00; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    a { color: #06c; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .form-generar { margin-top: 24px; padding-top: 16px; border-top: 1px solid #eee; }
  </style>
</head>
<body>
  {% with mensajes = get_flashed_messages() %}
    {% if mensajes %}
      {% for m in mensajes %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endif %}
  {% endwith %}
  {% block contenido %}{% endblock %}
</body>
</html>
