{% extends "base.html" %}
{% block contenido %}
  <p><a href="{{ url_for('admin_panel') }}">&larr; Volver al panel</a></p>
  <h1>Configurar código {{ fila.codigo }}</h1>

  <form method="post">
    <label for="nombre_cliente">Nombre del comercio / cliente</label>
    <input type="text" id="nombre_cliente" name="nombre_cliente"
           value="{{ fila.nombre_cliente or '' }}" placeholder="Ej: Panadería López">

    <label for="destino">Link de destino (Instagram, Google Maps, etc.)</label>
    <input type="text" id="destino" name="destino"
           value="{{ fila.destino or '' }}"
           placeholder="https://instagram.com/panaderialopez">

    <button type="submit">Guardar</button>
  </form>
{% endblock %}
