<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirigiendo...</title>

  <meta http-equiv="refresh" content="1.2;url={{ destino }}">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #f7f7f7, #ececec);
      color: #222;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 22px;
      padding: 38px 28px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0,0,0,0.08);
      backdrop-filter: blur(6px);
    }

    .emoji {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
      line-height: 1.1;
      letter-spacing: 0.5px;
    }

    p {
      margin: 14px 0 0;
      color: #666;
      font-size: 0.98rem;
      line-height: 1.5;
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 22px auto 0;
      border: 4px solid #e5e5e5;
      border-top: 4px solid #222;
      border-radius: 50%;
      animation: girar 0.8s linear infinite;
    }

    @keyframes girar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .watermark {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.85rem;
      letter-spacing: 4px;
      color: rgba(0,0,0,0.18);
      font-weight: bold;
      user-select: none;
    }

    @media (max-width: 480px) {
      .card {
        padding: 32px 22px;
        border-radius: 18px;
      }

      h1 {
        font-size: 1.55rem;
      }

      p {
        font-size: 0.93rem;
      }
    }
  </style>

  <script>
    setTimeout(function () {
      window.location.replace({{ destino|tojson }});
    }, 1200);
  </script>
</head>
<body>
  <div class="card">
    <div class="emoji">⭐</div>
    <h1>¿CÓMO LA PASASTE?</h1>
    <p>Te estamos redirigiendo para que continúes en un instante.</p>
    <div class="spinner"></div>
  </div>

  <div class="watermark">RF</div>
</body>
</html>
